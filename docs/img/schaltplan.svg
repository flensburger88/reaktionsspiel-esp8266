"><tspan x="1020.6" dy="14">DOUT</tspan></text><text x="954.0" y="-270.6" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="954.0" dy="10">WS2812B</tspan><tspan x="954.0" dy="10">#1</tspan></text><text x="1103.3999999999999" y="-266.0" dominant-baseline="central" fill="black" font-size="14" font-family="sans" text-anchor="start"><tspan x="1103.3999999999999" dy="14">DIN</tspan></text><text x="1243.8" y="-266.0" dominant-baseline="central" fill="black" font-size="14" font-family="sans" text-anchor="end"><tspan x="1243.8" dy="14">DOUT</tspan></text><text x="1177.2" y="-270.6" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="1177.2" dy="10">WS2812B</tspan><tspan x="1177.2" dy="10">#2</tspan></text><text x="1310.4" y="-270.0" dominant-baseline="central" fill="black" font-size="18" font-family="sans" text-anchor="middle"><tspan x="1310.4" dy="18">…</tspan></text><text x="1377.0000000000002" y="-266.0" dominant-baseline="central" fill="black" font-size="14" font-family="sans" text-anchor="start"><tspan x="1377.0000000000002" dy="14">DIN</tspan></text><text x="1517.4" y="-266.0" dominant-baseline="central" fill="black" font-size="14" font-family="sans" text-anchor="end"><tspan x="1517.4" dy="14">DOUT</tspan></text><text x="1450.8000000000004" y="-270.6" dominant-baseline="central" fill="black" font-size="10" font-family="sans" text-anchor="middle"><tspan x="1450.8000000000004" dy="10">WS2812B</tspan><tspan x="1450.8000000000004" dy="10">#4</tspan></text><text x="950.4000000000001" y="-331.40000000000003" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="950.4000000000001" dy="11">+5 V</tspan></text><text x="1173.6000000000001" y="-331.40000000000003" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="1173.6000000000001" dy="11">+5 V</tspan></text><text x="1447.2000000000003" y="-331.40000000000003" dominant-baseline="ideographic" fill="black" font-size="11" font-family="sans" text-anchor="middle"><tspan x="1447.2000000000003" dy="11">+5 V</tspan></text><text x="3.6" y="101.60000000000002" dominant-baseline="hanging" fill="#444444" font-size="10" font-family="sans" text-anchor="start"><tspan x="3.6" dy="10">grau = empfohlen, im Steckbrett-Prototyp noch nicht verbaut.</tspan><tspan x="3.6" dy="10">Taster: kein Widerstand nötig (INPUT_PULLUP + 10 kΩ auf dem Wemos an D3). D3 = GPIO0: beim Einschalten nicht drücken (sonst Flash-Modus).</tspan><tspan x="3.6" dy="10">LEDs mit +5 V versorgen, nicht aus dem 3V3-Pin. Im fertigen Button: 4× WS2812B in Kette (Prototyp: 8).</tspan></text><circle cx="342" cy="-180" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /><circle cx="342" cy="-0" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /><circle cx="464.4" cy="-0" r="2.7" style="stroke:black;fill:black;stroke-width:2.0;stroke-dasharray:-;" /></svg>