; ButtonSpielV3 - reaction game, units talk via ESP-NOW, phone web app on the gateway unit
; Every unit gets the same firmware; the gateway is elected automatically at boot.

[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
	fastled/FastLED@3.6.0 ; 3.10 refuses FASTLED_ALLOW_INTERRUPTS=0 on ESP8266
	esp32async/ESPAsyncTCP@^2.0.0
	esp32async/ESPAsyncWebServer@^3.7.0 ; async: a slow phone must not block the game loop
	bblanchon/ArduinoJson@^7.2.0
build_flags =
	-DFASTLED_ALLOW_INTERRUPTS=0
	-DFASTLED_INTERRUPT_RETRY_COUNT=0
	-DFASTLED_ESP8266_RAW_PIN_ORDER
	-DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH ; MSS 1460 instead of 536

; Hardware test after soldering: LEDs blink through all colors, button flashes them.
;   pio run -e hwtest -t upload -t monitor
[env:hwtest]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = fastled/FastLED@3.6.0
build_src_filter = -<*> +<../tools/hwtest/>
build_flags =
	-DFASTLED_ALLOW_INTERRUPTS=0
	-DFASTLED_INTERRUPT_RETRY_COUNT=0
	-DFASTLED_ESP8266_RAW_PIN_ORDER

; Wiring finder: LED data on D1..D7 in turn, button presses logged on every pin.
;   pio run -e pinscan -t upload
[env:pinscan]
extends = env:hwtest
build_src_filter = -<*> +<../tools/pinscan/>
